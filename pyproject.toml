[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loguru-logging-intercept"
version = "0.1.7"
description = "Code to integrate Loguru with Python's standard logging module"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
  { name = "Matthew D. Scholefield", email = "matthew331199@gmail.com" },
]
keywords = ["loguru", "logging", "intercept"]
dependencies = ["loguru"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/MatthewScholefield/loguru-logging-intercept"

[tool.setuptools]
py-modules = ["loguru_logging_intercept"]
